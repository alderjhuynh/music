<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HEAR ME AND WEEP</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="intro-on">

  <div id="intro" aria-hidden="true"></div>

  <div class="stage" id="stage">

    <div class="edge edge-left"><a href="https://auraea.fyi">auraea</a></div>
    <div class="edge edge-right"><div class="edge-right-track" id="edgeRight">— — —</div></div>

    <canvas id="canvas"></canvas>

    <div class="scroller" id="scroller">
      <div class="page">

        <header class="hud-top">
          <div class="crumbs">
            <span>hear me and weep</span>
          </div>
          <div class="key-label" id="keyLabel">—</div>
          <div class="title-label" id="titleLabel">select a track</div>
          <div class="notes-row">
            <span class="notes-caption">Notes:</span>
            <span class="notes-values" id="notesValues">—</span>
            <span class="swatch"></span><span class="swatch"></span>
          </div>
        </header>

        <div class="hud-stats" id="hudStats">
          <div id="onsetStat">events 0/0 (0.0%)</div>
          <div id="beatStat">beats 0/0 (0.0%)</div>
        </div>

        <section class="deck" aria-label="Player">
          <div class="win win-main">
            <div class="win-bar">
              <span class="win-title"></span>
              <span class="win-btns" aria-hidden="true"><i></i><i></i><i></i></span>
            </div>
            <div class="win-menu">
              <span class="pill">V-400-S-3</span>
              <span class="menu"><b>FILE</b><b>OPTIONS</b><b>HELP</b></span>
              <span class="user"><b>USER:</b> <span id="userLabel">@AURAEAMUSIC</span></span>
            </div>
            <div class="win-wave">
              <canvas id="waveCanvas"></canvas>
            </div>
            <div class="win-foot">
              <div class="transport">
                <button id="prevBtn" class="circle-btn" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
                <button id="playBtn" class="circle-btn" aria-label="Play / pause"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7z"/></svg></button>
                <button id="nextBtn" class="circle-btn" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
                <button id="modeBtn" class="circle-btn" aria-label="Playback mode"></button>
              </div>
              <div class="progress-wrap">
                <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
                <div class="time-readout" id="timeReadout">0:00 / 0:00</div>
              </div>
            </div>
          </div>

          <div class="fader" aria-hidden="true">
            <div class="fader-box">
              <div class="meter-bar" id="meterL"></div>
              <div class="meter-bar" id="meterR"></div>
            </div>
            <div class="fader-knob"></div>
            <span class="fader-lbl"></span>
          </div>

          <div class="timecode" id="timecode">00:00.00</div>

          <div class="counters">
            <div><span class="counter-label">bar</span><span class="counter-value" id="barCount">000</span></div>
            <div><span class="counter-label">beat</span><span class="counter-value" id="beatCount">00</span></div>
          </div>
        </section>

        <section class="tracks-sec">
          <div class="sec-head"><span>&gt; tracks/</span><span id="trackCount">0 / 0 online</span></div>
          <div class="tile-grid" id="tileGrid"></div>
        </section>

        <footer class="foot">
          <span>hear me and weep</span>
        </footer>
      </div>
    </div>

    <div class="invert-corner invert-tr" aria-hidden="true"></div>
    <div class="invert-corner invert-bl" aria-hidden="true"></div>
  </div>

  <audio id="audio" preload="auto" crossorigin="anonymous"></audio>
  <script src="intro.js"></script>
  <script src="app.js"></script>
</body>
</html>
